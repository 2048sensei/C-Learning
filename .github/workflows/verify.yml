name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release manifest and hashes
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Check internal links
        shell: pwsh
        run: node ./scripts/check-links.mjs
