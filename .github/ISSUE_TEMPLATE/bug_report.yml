name: 问题反馈
description: 页面打不开、代码示例跑不通、内容有误或表述不清
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。请尽量写清楚页面与现象，方便复现。
        如果只是个人学习进度丢失，请先确认是否换了浏览器、无痕窗口或移动过文件夹。
  - type: input
    id: page
    attributes:
      label: 页面
      description: 章节号或页面文件名，例如「第 13 章 指针入门」或 chapters/13-l13.html
      placeholder: 13 · 指针入门
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望看到什么
      description: 原文怎么写的、你期望它怎么讲
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
      description: 浏览器控制台报错、编译报错、显示异常，都请贴原文
      render: text
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 打开方式
      options:
        - 在线（GitHub Pages）
        - 便携版（开始学习.exe）
        - 直接打开 学习资源/index.html
        - 本地静态服务器
        - 其他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统
      placeholder: Edge 130 / Windows 11
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图（可直接粘贴）、相关 Issue 链接等
